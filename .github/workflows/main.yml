name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    name: Build snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake (light and dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1565C0&color_dots=#ebedf0,#bbdefb,#64b5f6,#1e88e5,#0d47a1
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00B4D8&color_dots=#161b22,#0b2a4a,#0d47a1,#1565C0,#00B4D8

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
