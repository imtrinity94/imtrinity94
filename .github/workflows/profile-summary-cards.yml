name: GitHub stats cards

on:
  schedule:
    - cron: "29 2 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    name: Generate profile summary cards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Uses a personal access token if you add one as SUMMARY_GITHUB_TOKEN, otherwise the built-in token
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 5.5
          THEME: tokyonight
